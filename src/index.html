<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/avif" href="./anchor.avif" />
    <title>CSS Anchor Toolkit</title>

    <!-- Google Fonts: Neue Haas Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      /* Font fallbacks for Neue Haas Grotesk using Inter as a close alternative */
      :root {
        --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        --font-mono: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
      }

      body {
        font-family: var(--font-body);
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Display font for headlines */
      .font-display {
        font-family: var(--font-display);
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      /* Neue Haas Grotesk-inspired styles */
      .font-grotesk {
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .font-grotesk-light {
        font-family: var(--font-display);
        font-weight: 300;
        letter-spacing: -0.01em;
      }

      .font-grotesk-medium {
        font-family: var(--font-display);
        font-weight: 500;
        letter-spacing: -0.015em;
      }

      .font-grotesk-semibold {
        font-family: var(--font-display);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .font-grotesk-bold {
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.025em;
      }

      .font-grotesk-extrabold {
        font-family: var(--font-display);
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .font-grotesk-black {
        font-family: var(--font-display);
        font-weight: 900;
        letter-spacing: -0.035em;
      }
    </style>

    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
